# himaiz.com: the static export in out/ served by Cloudflare Workers static assets.
# There is no Worker script, so requests don't count against the account's Worker quota.
# www.himaiz.com is a separate redirect-only Worker (edge/www/wrangler.toml).
# Workers Builds: root HiMaizProject/, build `npm run build`, deploy `npx wrangler deploy`.
name = "himaiz-web"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "himaiz.com", custom_domain = true }]

[assets]
directory = "./out"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true
